[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amanuensis"
version = "0.1.0"
description = "Fully local dictation for macOS. Hotkey, speak, text at the cursor."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Amanuensis contributors" }]
keywords = ["dictation", "speech-to-text", "local", "privacy", "whisper"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Dependencies arrive with the phase that first needs them, so that a broken
# wheel for a later phase cannot block work on an earlier one. Phase 1 adds the
# ASR path: `faster-whisper` (which brings CTranslate2 and, importantly, ships
# the Silero VAD ONNX asset inside its own wheel — see audio/vad.py, that is a
# G3 requirement and not a convenience) and `sounddevice` for microphone
# capture. The tray toolkit still waits for Phase 4.
#
# Phase 2a adds pyobjc for injection: NSPasteboard and NSWorkspace from Cocoa,
# CGEventPost and AXIsProcessTrusted from Quartz. The alternative was shelling
# out to `osascript` and `pbcopy`, which needs no dependency and was rejected
# twice over — a process spawn costs 30-80 ms against roughly 100 ms of total
# G1 headroom, and macOS attributes the Accessibility grant to the binary that
# posts the event, so routing through osascript would ask the user to trust
# osascript itself. That is both a wider grant than this app needs and one no
# remediation message can describe honestly.
#
# The marker keeps a Linux checkout installable. v1 is macOS-only (§3), but the
# test suite is not, and an unconditional pyobjc would make `pip install -e .`
# fail on the platform where most CI runs.
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=1.24",
    "platformdirs>=4.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]
# Benchmark-only. `useful-moonshine-onnx` exists so PRD §9's required
# faster-whisper vs. Moonshine comparison can run; nothing under `src/` imports
# it, and ADR 0001 records what it measured. Kept out of `dev` because a
# contributor running the test suite should not pay for a second ASR runtime.
bench = [
    "useful-moonshine-onnx>=20251120",
]

[project.scripts]
manu = "amanuensis.cli:main"

[project.urls]
Homepage = "https://github.com/joshedwards237/Amanuensis"
Source = "https://github.com/joshedwards237/Amanuensis"

[tool.hatch.build.targets.wheel]
packages = ["src/amanuensis"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations — mypy --strict wants them anyway
    "RUF",
]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation
    # This project's prose uses en-dashes and section signs throughout, to
    # match the PRD it is implementing. Flagging them as ambiguous unicode
    # would mean either mangling the prose or drowning in noqa comments.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may leave return annotations off assertions-only helpers.
"tests/**" = ["ANN201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests"]

# Phase 1's runtime dependencies ship no type information — none of
# faster-whisper, CTranslate2 or sounddevice carries a py.typed marker. The
# choice is between this and eight `# type: ignore` comments scattered across
# the four modules that touch them, which would suppress real errors in the
# same breath. Scoped to the named packages so that an untyped import
# appearing anywhere else still fails the gate.
#
# The pyobjc bridges are here for a second reason as well: they do not exist at
# all off macOS, so on a Linux checkout the import is missing rather than
# untyped, and the gate would fail for a platform the product does not target.
[[tool.mypy.overrides]]
module = [
    "AppKit.*",
    "ApplicationServices.*",
    "Quartz.*",
    "ctranslate2.*",
    "faster_whisper.*",
    "sounddevice.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
